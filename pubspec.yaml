name: an_ki
description: Gérer une liste d'anniversaires
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 17.5.0
  firebase_core: 4.15.0
  cloud_firestore: 6.10.0
  firebase_auth: 6.7.0
  google_sign_in: 7.2.0
  image_picker: 1.2.4
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  flutter_timezone: 5.1.1
  intl: 0.20.3
  mobile_scanner: 7.4.2
  http: 1.6.0
  flutter_contacts: 2.6.0
  local_auth: 3.0.2
  flutter_secure_storage: 11.2.0
  share_plus: 13.3.1
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  fake_cloud_firestore: 4.3.0
  firebase_auth_mocks: 0.15.2
  google_sign_in_platform_interface: 3.1.0
  mock_exceptions: 0.8.2
  plugin_platform_interface: 2.1.8


flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  # To add assets to your application, add an assets section, like this:
  # icon.png et brand.png ne servent qu'aux générateurs d'icône et de splash
  # (configurés plus bas) : seules les images affichées sont embarquées.
  assets:
    - lib/assets/lune.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Outfit statique (OFL, Outfitio/Outfit-Fonts@9027738), licence dans
  # lib/assets/fonts/OFL.txt.
  fonts:
    - family: Outfit
      fonts:
        - asset: lib/assets/fonts/Outfit-Regular.ttf
        - asset: lib/assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: lib/assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: lib/assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: lib/assets/fonts/Outfit-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  # Docs: https://pub.dev/packages/flutter_launcher_icons
  # Run: dart run flutter_launcher_icons
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true

flutter_native_splash:
  # Docs: https://pub.dev/packages/flutter_native_splash
  # Run: dart run flutter_native_splash:create
  color: "#121318"
  # color_dark: "#01295B"
  image: "lib/assets/icon.png"
  # image_dark: "lib/assets/icon.png"
  branding: "lib/assets/brand.png"
  android: true
  ios: true
  # Configuration spécifique pour Android 12+
  android_12:
    color: "#121318"
    image: "lib/assets/icon.png"
    branding: "lib/assets/brand.png"
    # branding_dark: "lib/assets/mythologie.png"
